name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted]

    defaults:
      run:
        shell: bash

    steps:
      - name: Update application
        run: |
          cd "$APP_DIR"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          npm ci
          npm run build:css

      - name: Start or update PM2 application
        run: |
          pm2 restart C:\Barcode_Printing_Node\ecosystem.config.js --update-env
          pm2 save