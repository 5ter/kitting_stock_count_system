name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted]  # We'll fix the labels later!

    defaults:
      run:
        shell: cmd  # <--- CHANGE HERE from powershell to cmd

    steps:
      - name: Update application
        run: |
          cd /d "%APP_DIR%"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          npm ci
          npm run build:css

      - name: Start or update PM2 application
        run: |
          cd /d "%APP_DIR%"
          pm2 restart ecosystem.config.js --update-env
          pm2 save