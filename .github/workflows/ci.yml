name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run check

      - name: Build CSS
        run: npm run build:css

      - name: Render Jade views
        run: node -e "const jade=require('jade'); jade.renderFile('views/index.jade',{title:'CI',totalCount:0,plants:[],departments:[]}); jade.renderFile('views/history.jade',{title:'CI',history:[]}); jade.renderFile('views/settings.jade',{title:'CI',printerIp:'127.0.0.1',printerPort:9100,maxLabelsPerBatch:0,timeZone:'Asia/Kuala_Lumpur',saved:false,historyCleared:false,error:null});"